  /* ---- yt-feather-highlight (registry component, verbatim) ------------------
     Spotlight part of the frame: a dim layer with a feathered ellipse hole.
     The hole's position/size are CSS variables; the helpers tween them.
     Mounted inside #pageLayer so the hole scroll-tracks the page. */
  .yt-hl{
    --yt-hl-x:50%; --yt-hl-y:16.5%; --yt-hl-rx:15%; --yt-hl-ry:10%;
    --yt-hl-dim:0.72;
    position:absolute; inset:0; pointer-events:none; opacity:0;
    background:rgba(6,8,12,var(--yt-hl-dim));
    -webkit-mask-image:radial-gradient(ellipse var(--yt-hl-rx) var(--yt-hl-ry) at var(--yt-hl-x) var(--yt-hl-y),transparent 0%,transparent 52%,black 88%);

  }
  /* ---- hw-callout-circle (registry component CSS, verbatim; font URL
     repointed to the project-local copy this host owns) ---------------------
     Wobbled ellipse outline draws around a target, scribble hatch sketches
     in, curved connector leads to a handwritten label that pops with
     momentum. Wrapper rules: boil owns x/y/rotation of .hw-co-boil; squash
     deforms .hw-co-deform; label rides uniform-scale .hw-co-pop. */
  .hw-callout{position:absolute;pointer-events:none}
  .hw-callout .hw-co-boil,
  .hw-callout .hw-co-deform,
  .hw-callout .hw-co-conn-layer,
  .hw-callout .hw-co-pop{position:absolute;inset:0}
  .hw-callout .hw-co-pop{opacity:0}

  .hw-callout .hw-co-outline{stroke:var(--hw-co-ink,var(--hw-ink,#f4f2ec));stroke-width:var(--hw-co-w,6)}

  .hw-callout .hw-co-connector{stroke:var(--hw-co-ink,var(--hw-ink,#f4f2ec));stroke-width:4}

  .pill::after{

    opacity:0;visibility:hidden}

<script>
  window.__timelines = window.__timelines || {};

  /* ---- yt-feather-highlight helpers (registry, verbatim) ---- */
  window.ytHighlightIn = function (tl, target, at, opts) {
    opts = opts || {};

      "--yt-hl-x": opts.x !== undefined ? opts.x : "50%",
      "--yt-hl-y": opts.y !== undefined ? opts.y : "50%",
      "--yt-hl-rx": opts.rx !== undefined ? opts.rx : "22%",
      "--yt-hl-ry": opts.ry !== undefined ? opts.ry : "26%"
    });
    tl.to(target, { opacity: 1, duration: 0.5, ease: "power2.out" }, at);
  };
  window.ytHighlightTo = function (tl, target, at, opts, dur) {
    opts = opts || {};
    var vars = { duration: dur === undefined ? 0.8 : dur, ease: "power2.inOut" };
    if (opts.x !== undefined) vars["--yt-hl-x"] = opts.x;
    if (opts.y !== undefined) vars["--yt-hl-y"] = opts.y;
    if (opts.rx !== undefined) vars["--yt-hl-rx"] = opts.rx;
    if (opts.ry !== undefined) vars["--yt-hl-ry"] = opts.ry;
    tl.to(target, vars, at);
  };
  window.ytHighlightOut = function (tl, target, at) {
    tl.to(target, { opacity: 0, duration: 0.4, ease: "power2.in" }, at);
  };

  /* ---- hw-callout-circle family runtime (registry, verbatim) ---- */
  window.hwOnUpdate = function (tl, fn) {
    if (!tl.__hwRenders) {
      tl.__hwRenders = [];
      tl.eventCallback("onUpdate", function () {
        for (var i = 0; i < tl.__hwRenders.length; i++) tl.__hwRenders[i]();
      });
    }
    tl.__hwRenders.push(fn);
    fn();
  };
  window.hwHash = function (n, seed) {
    var x = Math.sin(n * 127.1 + (seed || 1) * 311.7) * 43758.5453;
    return (x - Math.floor(x)) * 2 - 1;
  };
  window.hwBoil = function (tl, target, opts) {
    opts = opts || {};
    var amp = opts.amp !== undefined ? opts.amp : 1.6;
    var rot = opts.rot !== undefined ? opts.rot : 0.5;
    var fps = opts.fps || 30;
    var drop = opts.frameDrop || 3;
    var seed = opts.seed || 1;
    var els = gsap.utils.toArray(target);

          y: window.hwHash(step * 3 + 1 + i * 97, seed) * amp,

  window.hwBoilPose = function (tl, target, pose, opts) {
    opts = opts || {};
    var poses = { calm: { amp: 1.6, rot: 0.5 }, lively: { amp: 2.6, rot: 0.9 } };

    var p = poses[pose];
    if (!p) {
      console.error('hw: unknown boil pose "' + pose + '" — falling back to "calm"');
      p = poses.calm;
    }
    window.hwBoil(tl, target, { amp: p.amp, rot: p.rot, frameDrop: 3, seed: opts.seed || 1 });
  };
  var LN1000 = Math.log(1000);
  var FEELS = {
    snappy: { zeta: 0.9, response: 0.22 },
    "heavy-settle": { zeta: 1.0, response: 0.8 },
    bouncy: { zeta: 0.5, response: 0.4 },
    wobbly: { zeta: 0.28, response: 0.5 }
  };
  window.springEase = function (opts) {
    var f = opts.feel ? FEELS[opts.feel] : opts;
    var zeta = f.zeta, response = f.response;
    var w0 = (2 * Math.PI) / response;
    var T = LN1000 / (zeta * w0);
    var x;
    if (zeta < 1) {
      var wd = w0 * Math.sqrt(1 - zeta * zeta);
      x = function (t) {
        return 1 - Math.exp(-zeta * w0 * t) * (Math.cos(wd * t) + ((zeta * w0) / wd) * Math.sin(wd * t));
      };
    } else {
      x = function (t) { return 1 - Math.exp(-w0 * t) * (1 + w0 * t); };
    }
    var xT = x(T);
    return { ease: function (p) { return p >= 1 ? 1 : x(p * T) / xT; }, duration: T, zeta: zeta, response: response };
  };
  window.hwWobbleEllipse = function (cx, cy, rx, ry, seed, wobblePct) {

    for (var i = 0; i < N; i++) {
      var a = (i / N) * Math.PI * 2;
      var wr = 1 + window.hwHash(i * 13 + 5, seed) * (wobblePct / 100);
      pts.push([cx + Math.cos(a) * rx * wr, cy + Math.sin(a) * ry * wr]);
    }
    var mx = (pts[0][0] + pts[N - 1][0]) / 2, my = (pts[0][1] + pts[N - 1][1]) / 2;
    var d = "M" + mx.toFixed(1) + " " + my.toFixed(1);
    for (var j = 0; j < N; j++) {
      var p = pts[j], q = pts[(j + 1) % N];
      d += " Q" + p[0].toFixed(1) + " " + p[1].toFixed(1) + " " + ((p[0] + q[0]) / 2).toFixed(1) + " " + ((p[1] + q[1]) / 2).toFixed(1);
    }

    opts = opts || {};
    var cfg = window.hwStrokeTypes[type];
    if (!cfg) {

    var defs = svg.querySelector("defs");
    if (!defs) {

      svg.insertBefore(defs, svg.firstChild);
    }
    var mask = document.createElementNS(ns, "mask");
    mask.setAttribute("id", id);
    mask.setAttribute("maskUnits", "userSpaceOnUse");
    var clone = document.createElementNS(ns, "path");
    clone.setAttribute("d", pathEl.getAttribute("d"));
    clone.setAttribute("fill", "none");
    clone.setAttribute("stroke", "#fff");
    clone.setAttribute("stroke-width", w * (type === "spray" ? 2 + (cfg.scatter * 2) / w : 1.7));

    group.setAttribute("mask", "url(#" + id + ")");

      pathEl.style.filter = "blur(" + cfg.coreBlur + "px)";
      var len = pathEl.getTotalLength();
      var n = Math.round(len * cfg.density * (opts.densityScale || 1));
      var seed = opts.seed || 1;
      var dots = document.createElementNS(ns, "g");
      for (var i = 0; i < n; i++) {
        var t = Math.min(1, Math.max(0, (i + 0.5) / n + (window.hwHash(i * 7, seed) * 0.35) / n));
        var pt = pathEl.getPointAtLength(t * len);
        var pt2 = pathEl.getPointAtLength(Math.min(len, t * len + 0.5));
        var tx = pt2.x - pt.x, ty = pt2.y - pt.y;
        var tl2 = Math.hypot(tx, ty) || 1;
        var nx = -ty / tl2, nyv = tx / tl2;
        var off = window.hwHash(i * 7 + 1, seed) * (cfg.scatter + w * 0.55);
        var r = cfg.rMin + Math.abs(window.hwHash(i * 7 + 2, seed)) * (cfg.rMax - cfg.rMin);
        var c = document.createElementNS(ns, "circle");
        c.setAttribute("cx", (pt.x + nx * off).toFixed(1));
        c.setAttribute("cy", (pt.y + nyv * off).toFixed(1));
        c.setAttribute("r", r.toFixed(2));
        c.setAttribute("fill", getComputedStyle(pathEl).stroke);
        dots.appendChild(c);
      }
      group.appendChild(dots);
    }
    return { draw: clone, group: group, type: type };
  };
  window.hwDrawOn = function (tl, applied, at, dur, opts) {
    opts = opts || {};
    var p = applied.draw;
    var len = p.getTotalLength();
    p.setAttribute("stroke-dasharray", len + " " + len);
    p.setAttribute("stroke-dashoffset", len);
    gsap.set(p, { opacity: 0 });
    var ease = opts.ease || "power2.inOut";
    tl.set(p, { opacity: 1 }, at);
    tl.to(p, { strokeDashoffset: 0, duration: dur === undefined ? 0.7 : dur, ease: ease }, at);
  };
  window.hwCalloutBuild = function (target, opts) {
    opts = opts || {};
    var seed = opts.seed || 1;
    var el = document.querySelector(target);
    var svg = el.querySelector("svg");
    var vb = svg.getAttribute("viewBox").split(" ");
    var W = parseFloat(vb[2]), H = parseFloat(vb[3]);
    var cx = W / 2, cy = H / 2, rx = W * 0.42, ry = H * 0.36;
    var outline = el.querySelector(".hw-co-outline");
    outline.setAttribute("d", window.hwWobbleEllipse(cx, cy, rx, ry, seed, 4));
    var scr = el.querySelector(".hw-co-scribble");
    if (opts.scribble === false) {
      scr.style.display = "none";
    } else {
      var d = "", rows = 11;
      for (var i = 0; i < rows; i++) {
        var t = (i + 0.5) / rows;
        var yy = cy - ry + t * ry * 2;
        var half = Math.sqrt(Math.max(0.05, 1 - Math.pow((yy - cy) / ry, 2)));
        var xw = rx * half * 0.86;
        var xa = cx - xw + window.hwHash(i * 7 + 2, seed) * 8;
        var xb = cx + xw + window.hwHash(i * 7 + 3, seed) * 8;
        d += (i === 0 ? "M " : " L ") + (i % 2 ? xa : xb).toFixed(1) + " " + yy.toFixed(1);
        d += " L " + (i % 2 ? xb : xa).toFixed(1) + " " + (yy + window.hwHash(i * 7 + 4, seed) * 4).toFixed(1);
      }
      scr.setAttribute("d", d);
    }
    var conn = el.querySelector(".hw-co-connector");
    var label = el.querySelector(".hw-co-label");
    var at = opts.labelAt || "right";
    if (at !== "left" && at !== "right" && at !== "below") {
      console.error('hw: unknown labelAt "' + at + '" — falling back to "right"');
      at = "right";
    }
    var ex = null, ey = null;
    if (opts.connector === false) {
      conn.style.display = "none";
    } else {
      var sx = at === "left" ? cx - rx : at === "below" ? cx : cx + rx;
      var sy = at === "below" ? cy + ry : cy + ry * 0.35;
      ex = at === "left" ? sx - 70 : at === "below" ? sx + 40 : sx + 70;
      ey = sy + 55;
      conn.setAttribute("d", "M " + sx.toFixed(1) + " " + sy.toFixed(1) + " Q " +
        ((sx + ex) / 2 + window.hwHash(21, seed) * 14).toFixed(1) + " " + (sy + 46).toFixed(1) + " " +
        ex.toFixed(1) + " " + ey.toFixed(1));
      label.style.left = (at === "left" ? ex - 180 : ex + 12) + "px";
      label.style.top = ey - 24 + "px";
    }
    label.textContent = opts.label || "";
    var strokeType = opts.strokeType || "plain";
    var idBase = (el.id || "hw-co") + "-sm";
    el.__hwCo = {
      rx: rx,
      seed: seed,
      boil: opts.boil || "calm",
      popOrigin: ex === null ? "50% 50%" : ex.toFixed(1) + "px " + ey.toFixed(1) + "px",
      draw: {
        outline: window.hwStrokeApply(outline, strokeType, { seed: seed, id: idBase + "-outline" }),
        scribble: opts.scribble === false ? null : window.hwStrokeApply(scr, "plain", { seed: seed }),
        connector: opts.connector === false ? null : window.hwStrokeApply(conn, strokeType, { seed: seed, id: idBase + "-connector" })
      }
    };
  };
  window.hwCalloutOn = function (tl, target, at) {
    var el = document.querySelector(target);
    var co = el.__hwCo;
    var t = at;
    ["outline", "scribble", "connector"].forEach(function (k) {
      var rec = co.draw[k];
      if (!rec) return;
      var dur = k === "scribble" ? 0.55 : k === "connector" ? 0.35 : 0.7;
      window.hwDrawOn(tl, rec, t, dur);
      t += dur * 0.85;
    });
    var pop = el.querySelector(".hw-co-pop");
    var popEase = gsap.parseEase("power2.in");
    gsap.set(pop, { scale: 0.001, opacity: 0, transformOrigin: co.popOrigin });
    tl.to(pop, { opacity: 1, duration: 0.08, ease: "none" }, t);
    tl.to(pop, { scale: 1, duration: 0.3, ease: popEase, immediateRender: false }, t);
    var eps = 1e-4, pc = 1;
    for (var k2 = 1; k2 <= 1000; k2++) {
      if (popEase(k2 / 1000) >= 1) { pc = k2 / 1000; break; }
    }
    var vPop = ((popEase(Math.min(pc + eps, 1)) - popEase(pc - eps)) / (2 * eps)) * (co.rx / 0.3);
    var S = Math.min(0.08 * (Math.abs(vPop) / 2000), 0.25);
    var rec2 = window.springEase({ feel: "snappy" });
    var st = { s: 0 };
    var deform = el.querySelector(".hw-co-deform");
    gsap.set(deform, { transformOrigin: "50% 100%" });
    window.hwOnUpdate(tl, function () {
      var along = 1 - st.s;
      gsap.set(deform, { scaleY: along, scaleX: 1 / along });
      var ax = parseFloat(gsap.getProperty(deform, "scaleX"));
      var ay = parseFloat(gsap.getProperty(deform, "scaleY"));
      if (Math.abs(ax * ay - 1) > 0.01) console.error("hw volume law violated (callout): " + (ax * ay).toFixed(4));
    });
    tl.to(st, { s: S, duration: 2 / 30, ease: "power3.out" }, t + 0.3);
    tl.to(st, { s: 0, duration: rec2.duration, ease: rec2.ease }, t + 0.3 + 3 / 30);
    window.hwBoilPose(tl, el.querySelector(".hw-co-boil"), co.boil, { seed: co.seed });
  };
  window.hwCalloutOff = function (tl, target, at) {
    tl.to(target, { opacity: 0, duration: 0.35, ease: "power2.in" }, at);
  };

  /* host content: build the two scribble callouts into their measured wrappers.
     scribble:false — the 11-row hatch is tuned for small targets; across
     380–1200px wrappers it renders as banding that buries the annotated
     content (verified in proof frames). The wobbled outline + connector +
     handwritten label carry the scribble language. */
  window.hwCalloutBuild("#hwFan", { seed: 4, scribble: false, label: "Chip action over the hero fan", labelAt: "right", strokeType: "plain", boil: "calm" });
  window.hwCalloutBuild("#hwRules", { seed: 7, scribble: false, label: "Blackjack rules \u2014 the table briefing", labelAt: "below", strokeType: "plain", boil: "calm" });

  const tl = gsap.timeline({ paused: true });

  /* 0.0s hook: scale_punch on hero title over veil */
  tl.fromTo("#veilTitle", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.55, ease: "back.out(2.2)" }, 0.1);
  tl.fromTo("#veilKicker", { autoAlpha: 0, y: -24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);
  tl.fromTo("#veilSub", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.25);
  tl.to("#veil", { autoAlpha: 0, duration: 0.45, ease: "power2.in" }, 0.95);

  /* scroll-camera-story pass 1: hero -> setup (lands 3.0s) */
  tl.fromTo("#pageLayer", { y: 0 }, { y: -240, duration: 2.2, ease: "power2.inOut" }, 0.8);

  /* oversized cursor: enters, tours fan, lands on Play now (screen 1150,442 @ scroll -240) */
  tl.fromTo("#cursor", { autoAlpha: 0, x: 1750, y: 1000 }, { autoAlpha: 1, x: 1750, y: 1000, duration: 0.4, ease: "power2.out" }, 0.6);
  tl.to("#cursor", { x: 1300, y: 300, duration: 0.9, ease: "power2.inOut" }, 1.0);
  tl.to("#cursor", { x: 1114, y: 406, duration: 1.0, ease: "power2.inOut" }, 1.9);

  /* hero fan callout: hw-callout-circle draws ON after arrival, never pre-applied */
  window.hwCalloutOn(tl, "#hwFan", 1.2);
  window.hwCalloutOff(tl, "#hwFan", 3.9);
  window.ytHighlightIn(tl, "#hl", 1.2, { x: "50%", y: "16.5%", rx: "15%", ry: "10%" });
  /* setup card locator frame + callout while its anchor is on screen (scroll pass 1) */
  window.ytHighlightTo(tl, "#hl", 2.2, { x: "66.8%", y: "29.4%", rx: "20%", ry: "36%" }, 0.6);
  tl.fromTo("#spotSetupFrame", { autoAlpha: 0, scaleX: 0 }, { autoAlpha: 1, scaleX: 1, duration: 0.55, ease: "power3.out", transformOrigin: "left center" }, 2.2);
  tl.fromTo("#pillSetup", { autoAlpha: 0, scale: 0.6, y: 16 }, { autoAlpha: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(2.0)" }, 2.4);
  tl.to("#pillSetup", { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, 3.2);

  /* 3.0s beat: press-ripple click + spotlight wipe on Play now + callout pop */
  tl.fromTo("#ripple1", { autoAlpha: 0.95, scale: 0.25 }, { autoAlpha: 0, scale: 2.4, duration: 0.6, ease: "power2.out" }, 3.0);
  tl.fromTo("#ripple2", { autoAlpha: 0.9, scale: 0.25 }, { autoAlpha: 0, scale: 3.1, duration: 0.75, ease: "power2.out" }, 3.12);
  tl.fromTo("#cursor", { scale: 1 }, { scale: 0.86, duration: 0.12, ease: "power2.in", yoyo: true, repeat: 1, transformOrigin: "20% 15%", immediateRender: false }, 3.0);
  tl.fromTo("#spotPlayFrame", { autoAlpha: 0, scaleX: 0 }, { autoAlpha: 1, scaleX: 1, duration: 0.5, ease: "power3.out", transformOrigin: "left center" }, 3.0);
  window.ytHighlightTo(tl, "#hl", 3.0, { x: "59.9%", y: "40.8%", rx: "9%", ry: "4.5%" }, 0.5);
  tl.fromTo("#pillPlay", { autoAlpha: 0, scale: 0.6, y: 16 }, { autoAlpha: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(2.0)" }, 3.3);
  tl.to("#pillPlay", { scale: 1.015, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.8);
  tl.to("#spotPlayFrame", { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, 5.6);
  tl.to("#pillPlay", { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, 5.6);
  window.ytHighlightOut(tl, "#hl", 5.6);

  /* setup frame hands off to the Play-now beat */
  tl.to("#spotSetupFrame", { autoAlpha: 0, duration: 0.45, ease: "power2.in" }, 3.5);

  /* scroll-camera-story pass 2: setup -> rules (lands 6.7s); cursor tours to rules */
  tl.to("#pageLayer", { y: -590, duration: 2.5, ease: "power2.inOut" }, 4.2);
  tl.to("#cursor", { x: 1450, y: 700, duration: 0.6, ease: "power2.inOut" }, 3.6);
  tl.to("#cursor", { x: 923, y: 719, duration: 1.6, ease: "power2.inOut" }, 5.3);

  /* 7.0s beat: feathered spotlight + hw-callout-circle draw + handwritten label pop */
  window.ytHighlightIn(tl, "#hl", 7.0, { x: "49.9%", y: "80.5%", rx: "40%", ry: "22%" });
  window.hwCalloutOn(tl, "#hwRules", 7.0);

  /* readable hold, then clear stage for end card (cursor hands off to the spotlight at 7.3) */
  tl.to("#cursor", { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, 7.3);
  window.ytHighlightOut(tl, "#hl", 10.6);
  window.hwCalloutOff(tl, "#hwRules", 10.6);
  tl.to("#pageLayer", { autoAlpha: 0.25, duration: 0.5, ease: "power2.inOut" }, 10.6);

  /* 11.0s: logo-outro end card lockup */
  tl.fromTo("#endcard", { autoAlpha: 0, y: 60 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" }, 11.0);
  tl.fromTo("#chip", { autoAlpha: 0, scale: 0.5, rotation: -40 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)" }, 11.2);
  tl.fromTo("#wordmark", { autoAlpha: 0, y: 48 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 11.45);
  tl.fromTo("#tagline", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, 11.7);
  tl.fromTo("#urlpill", { autoAlpha: 0, scale: 0.7 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(2.0)" }, 11.95);
  tl.to("#urlpill", { boxShadow: "0 0 0 6px rgba(240,221,169,.55),0 0 90px rgba(240,221,169,.9),0 14px 50px rgba(0,0,0,.55)", duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 12.4);

  /* 14s: fade_out */
  tl.fromTo("#outroblack", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6, ease: "power2.in" }, 13.4);

  window.__timelines["blackjack-promo"] = tl;
  tl.seek(0);
</script>
