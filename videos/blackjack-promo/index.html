<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #sub {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-ab2m" id="stage" data-composition-id="blackjack-promo" data-start="0" data-duration="14" data-fps="30" data-width="1920" data-height="1080">
      <div data-hf-id="hf-xopf" id="sub" class="clip" data-start="0" data-duration="14" data-track-index="0" data-composition-src="compositions/index.html" data-composition-id="blackjack-promo"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to("#sub", { duration: 14 }, 0);
      window.__timelines["blackjack-promo"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
